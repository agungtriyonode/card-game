<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberfall — Duel of the Last Flame</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #160e0a; }
  #game {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(100vw, 160vh);
    height: min(100vh, 62.5vw);
    display: block;
    cursor: pointer;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Emberfall, a card duel: spend ember, summon creatures, and bring the Cinder Warden to zero life"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
